<!-- ══════════════════════════════════════════════════════════════════════
     SIGN-IN — self-contained. Nothing outside this file is needed.
     Uses the same Firebase account as the OneStop apps, but keeps its own
     session on the phone, so this app stays completely separate.
     ══════════════════════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
var API_KEY = 'AIzaSyAHscKi2FwP-aS0CxhGNym3_BH5k5diqjc';
var EMAIL   = 'owner@onestopdrivein.com';
var DB_HOST = 'attendance-and-salary-tr-20681-default-rtdb.asia-southeast1.firebasedatabase.app';
var HOLD_H  = 12;                       // hours before the password is asked again

var K = {r:'pa-refresh', u:'pa-until', t:'pa-tok', x:'pa-tokexp'};
function ls(k){ try{return localStorage.getItem(k)}catch(e){return null} }
function set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
function del(k){ try{localStorage.removeItem(k)}catch(e){} }

var tok=null, exp=0, pending=null, waiters=[];
(function(){ var t=ls(K.t), x=+ls(K.x)||0; if(t&&Date.now()<x){tok=t;exp=x;} })();
function held(){ return Date.now() < (+ls(K.u)||0); }

function post(url,body,form){
  return fetch(url,{method:'POST',
    headers:{'Content-Type': form?'application/x-www-form-urlencoded':'application/json'},
    body: form?body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){
      if(!r.ok) throw new Error((j&&j.error&&j.error.message)||'auth failed');
      return j; }); });
}
function keep(t,r,s){
  tok=t; exp=Date.now()+(Number(s||3600)-120)*1000;
  set(K.t,t); set(K.x,String(exp)); if(r) set(K.r,r);
  var q=waiters; waiters=[]; q.forEach(function(w){ w(t); });
  return t;
}
function signIn(pw){
  return post('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+API_KEY,
              {email:EMAIL,password:pw,returnSecureToken:true})
    .then(function(j){ set(K.u,String(Date.now()+HOLD_H*3600000));
                       return keep(j.idToken,j.refreshToken,j.expiresIn); });
}
function refresh(){
  var rt=ls(K.r);
  if(!rt) return Promise.reject(new Error('no session'));
  return post('https://securetoken.googleapis.com/v1/token?key='+API_KEY,
              'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt),true)
    .then(function(j){ return keep(j.id_token,j.refresh_token,j.expires_in); })
    .catch(function(e){ del(K.r); throw e; });
}
function token(){
  if(tok && Date.now()<exp) return Promise.resolve(tok);
  if(pending) return pending;
  if(!held() || !ls(K.r)) return new Promise(function(ok){ waiters.push(ok); });
  pending = refresh().then(function(t){ pending=null; return t; })
                     .catch(function(e){ pending=null; gate(); throw e; });
  return pending;
}

/* every database call gets the token stapled on */
var raw = window.fetch.bind(window);
window.fetch = function(input, init){
  var url = typeof input==='string' ? input : (input&&input.url)||'';
  if(url.indexOf(DB_HOST)===-1) return raw(input,init);
  var call=function(t,retry){
    return raw(url+(url.indexOf('?')>-1?'&':'?')+'auth='+encodeURIComponent(t), init)
      .then(function(r){
        if((r.status===401||r.status===403)&&!retry){
          tok=null; exp=0; del(K.t); del(K.x);
          return token().then(function(t2){ return call(t2,true); });
        }
        return r;
      });
  };
  return token().then(function(t){ return call(t,false); });
};

/* ---- the password screen, in this app's own colours ---- */
var el=null, busy=false;
function paint(){
  if(document.getElementById('paCss')) return;
  var s=document.createElement('style'); s.id='paCss';
  s.textContent=
  'html.pa-locked body>*:not(#paGate){display:none!important}'+
  '#paGate{position:fixed;inset:0;z-index:2147483000;background:#0B1526;color:#fff;'+
    'display:flex;align-items:center;justify-content:center;padding:24px 20px;'+
    'font-family:Inter,system-ui,-apple-system,sans-serif}'+
  '#paGate .b{width:100%;max-width:300px;text-align:center}'+
  '#paGate .sp{width:44px;height:3px;background:#A97514;border-radius:2px;margin:0 auto 16px}'+
  '#paGate h1{font-family:Chivo,system-ui,sans-serif;font-size:19px;font-weight:800;margin:0 0 4px}'+
  '#paGate p{font-size:12.5px;color:#8DA0B8;margin:0 0 22px;letter-spacing:.02em}'+
  '#paGate input{width:100%;padding:14px;border-radius:10px;border:1px solid #24344B;'+
    'background:#141F33;color:#fff;font-size:16px;text-align:center;letter-spacing:.3em}'+
  '#paGate input:focus{outline:none;border-color:#A97514}'+
  '#paGate button{width:100%;margin-top:12px;padding:14px;border:none;border-radius:10px;'+
    'background:#A97514;color:#1B1200;font-family:Chivo,sans-serif;font-weight:800;font-size:14.5px;cursor:pointer}'+
  '#paGate button[disabled]{opacity:.5}'+
  '#paGate .m{font-size:12px;color:#E2614C;height:30px;margin-top:10px;line-height:1.35}';
  (document.head||document.documentElement).appendChild(s);
}
function why(m){
  if(/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_CREDENTIAL/.test(m)) return 'Wrong password. Try again.';
  if(/TOO_MANY_ATTEMPTS/.test(m)) return 'Too many tries. Wait a few minutes.';
  if(/NETWORK|Failed to fetch/i.test(m)) return 'No connection. Check the internet.';
  return 'Could not sign in. '+m;
}
function gate(){
  paint();
  if(!el){
    el=document.createElement('div'); el.id='paGate';
    el.innerHTML='<div class="b"><div class="sp"></div>'+
      '<h1>Project Accounts</h1><p>Enter the password to open this.</p>'+
      '<input id="paPw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••">'+
      '<button id="paGo" type="button">Open</button><div class="m" id="paMsg"></div></div>';
    var go=function(){
      if(busy) return;
      var pw=el.querySelector('#paPw').value.trim();
      if(!pw) return;
      busy=true;
      el.querySelector('#paGo').disabled=true;
      el.querySelector('#paMsg').textContent='Signing in…';
      el.querySelector('#paMsg').style.color='#8DA0B8';
      signIn(pw).then(function(){ location.reload(); })
        .catch(function(e){
          busy=false;
          el.querySelector('#paGo').disabled=false;
          el.querySelector('#paPw').value='';
          el.querySelector('#paMsg').style.color='#E2614C';
          el.querySelector('#paMsg').textContent=why(e.message||'');
        });
    };
    el.querySelector('#paGo').onclick=go;
    el.querySelector('#paPw').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
  }
  if(!el.isConnected) (document.body||document.documentElement).appendChild(el);
  document.documentElement.classList.add('pa-locked');
  setTimeout(function(){ var i=el.querySelector('#paPw'); if(i) i.focus(); },60);
}

window.PAAuth = {
  token: token,
  isOpen: function(){ return held() && !!ls(K.r); },
  ask: gate,
  signOut: function(){ del(K.r); del(K.u); del(K.t); del(K.x); tok=null; exp=0; }
};

var locked = !PAAuth.isOpen();
if(locked){ paint(); document.documentElement.classList.add('pa-locked'); }
function boot(){
  if(locked) gate();
  else token().catch(function(){ gate(); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>

<style>

main{padding:var(--pad) var(--pad) 0;max-width:760px;margin:0 auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:14px;overflow:hidden}

/* signature: survey tape */

  repeating-linear-gradient(90deg,var(--rule2) 0 1px,transparent 1px 10%),

  var(--card);
  background-position:0 0;overflow:hidden}
.tape i{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:rgba(42,74,120,.13);background:color-mix(in srgb,var(--accent) 16%,transparent);border-right:2px solid var(--accent);transition:width .35s ease}
.tape u{position:absolute;left:8px;bottom:5px;font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-decoration:none}

}

.crow{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--rule2);width:100%;text-align:left}

.cfig{text-align:right;flex:none}

.cpc{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--ink3);margin-top:2px}

.entry{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--rule2);position:relative}

.toast.on{opacity:1}
</style>

<body>

<header>
  <div class="mast">
    <div class="brand">
      <div class="spine" id="spine"></div>
      <div>
        <h1>Project Accounts</h1>
        <p id="hsub">Varanasi</p>
      </div>
    </div>
    <div class="tools-top">
      <button class="iconbtn" id="btnCats" title="Categories" aria-label="Categories">☰</button>
      <button class="iconbtn" id="btnSet" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </div>
  <nav class="tabs">
    <button data-k="varanasi" class="on">Varanasi</button>
    <button data-k="psr">PSR Projects</button>
    <button data-k="nri">NRI Funds</button>
  </nav>
  <div class="status" id="syncline"><span class="led"></span><span>Local only · <b>not synced</b></span></div>
</header>

<main id="view"></main>

<button class="fab" id="fab">+ Record payment</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="shead">
    <button class="sbtn" id="sheetBack" aria-label="Back" hidden>‹</button>
    <h2 class="disp" id="sheetTitle">—</h2>
    <button class="sbtn" id="sheetX" aria-label="Close">✕</button>
  </div>
  <div class="sbody" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>

const K='psr_varanasi_accounts_v1';

function save(push=true){

  render();

/* stamp a record with its edit time so the newest edit wins on merge */
const stamp=o=>{o.m=Date.now();return o;};

/* ---------- firebase rest sync (merge based) ---------- */
let tmr=null, busy=false;
const ready=()=>!!S.fb;
const dbPath=()=>S.fb.replace(/\/$/,'')+'/'+NODE+'.json';
const payload=()=>{const{fb,...rest}=S;return rest;};
function line(html,cls){
  const el=document.getElementById('syncline');
  el.className='status'+(cls?' '+cls:'');
  el.innerHTML='<span class="led"></span><span>'+html+'</span>';
}
const clock=()=>new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});

/* merge two lists of records by id: newest edit wins, tombstones remove */
function mergeList(local,remote,tomb){
  const map={};
  const add=x=>{ if(!x||!x.id) return; const c=map[x.id];
    if(!c||(+x.m||0)>=(+c.m||0)) map[x.id]=x; };
  (local||[]).forEach(add);
  (remote||[]).forEach(add);
  return Object.keys(map).map(k=>map[k])
    .filter(x=>!(tomb[x.id]&&tomb[x.id]>=(+x.m||0)));
}
function mergeTomb(remote){
  const t=Object.assign({},remote||{});
  Object.keys(S.tomb||{}).forEach(k=>{ if(!t[k]||S.tomb[k]>t[k]) t[k]=S.tomb[k]; });
  const cut=Date.now()-120*86400000;
  Object.keys(t).forEach(k=>{ if(t[k]<cut) delete t[k]; });
  return t;
}

/* fetch that gives up after 8s instead of hanging forever on a bad signal */
function fetchT(url,opt,ms){
  opt=opt||{}; ms=ms||8000;
  const ac=new AbortController();
  const t=setTimeout(()=>ac.abort(),ms);
  return fetch(url,Object.assign({},opt,{signal:ac.signal}))
    .finally(()=>clearTimeout(t));
}

/* one full cycle: read what is on Firebase, merge it with this phone, write back */
async function syncNow(quiet){
  if(!ready()){line('Local only · <b>not synced</b>');return;}
  if(busy) return; busy=true;
  try{
    if(!quiet) line('Firebase · <b>syncing…</b>','warn');
    const r=await fetchT(dbPath(),{cache:'no-store'});
    if(!r.ok){ line('Firebase · <b>read blocked ('+r.status+')</b>','warn'); return; }
    const d=await r.json();
    if(d){
      S.tomb=mergeTomb(d.tomb);
      S.entries=mergeList(S.entries,d.entries,S.tomb);
      S.nri=mergeList(S.nri,d.nri,S.tomb);
      S.cats=mergeList(S.cats,d.cats,S.tomb);
    }
    LS.set(K,JSON.stringify(S));
    render();
    const w=await fetchT(dbPath(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});
    if(!w.ok){ line('Firebase · <b>write blocked ('+w.status+')</b>','warn'); return; }
    line('Firebase · <b>synced '+clock()+'</b>','live');
  }catch(e){
    line('Firebase · <b>offline, will retry</b>','warn');
  }finally{
    busy=false;          /* always released, even on timeout or error */
  }
}
function sync(){ clearTimeout(tmr); tmr=setTimeout(()=>syncNow(true),400); }
const pull=()=>syncNow(true);

/* live listener: Firebase pushes the moment the other phone saves */
let es=null;
/* EventSource is not a fetch, so the sign-in block above cannot slip the token
   in for it. We ask for the token ourselves and hang it on the URL. When it
   expires the stream errors, closes, and the retry picks up a fresh one. */
function liveOn(){
  if(!ready()||es) return;
  const start=tok=>{
    if(es) return;
    try{
      es=new EventSource(dbPath()+(tok?'?auth='+encodeURIComponent(tok):''));
      es.addEventListener('put',()=>pull());
      es.addEventListener('patch',()=>pull());
      es.onerror=()=>{ liveOff(); setTimeout(liveOn,5000); };
    }catch(e){ es=null; }
  };
  if(window.PAAuth) PAAuth.token().then(start).catch(()=>{});
  else start('');
}
function liveOff(){ if(es){ try{es.close()}catch(e){} es=null; } }

/* ---------- data views ---------- */
function rows(){
  return S.entries.filter(e=>e.project===tab)
    .filter(e=>!month||(e.date||'').slice(0,7)===month)
    .filter(e=>{if(!q)return true;const s=q.toLowerCase();
      return (e.desc||'').toLowerCase().includes(s)||(e.payee||'').toLowerCase().includes(s)||catName(e.cat).toLowerCase().includes(s);})
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
const sum=a=>a.reduce((t,x)=>t+(+x.amount||0),0);
const nriTotal=()=>S.nri.reduce((t,x)=>t+(+x.inr||0),0);
const spentAll=()=>sum(S.entries);
const spentOn=p=>sum(S.entries.filter(e=>e.project===p));
function months(){
  return [...new Set(S.entries.filter(e=>e.project===tab).map(e=>(e.date||'').slice(0,7)))].filter(Boolean).sort().reverse();
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===tab));
  document.documentElement.style.setProperty('--accent',tab==='varanasi'?'var(--varanasi)':tab==='psr'?'var(--psr)':'var(--nri)');

  document.getElementById('fab').textContent=tab==='nri'?'+ Record receipt':'+ Record payment';
  document.getElementById('view').innerHTML = tab==='nri'?viewNRI():viewProject();
  bind();
}

/* the survey tape — how far the money has run against what came in */
function tape(spent,base,capLabel){
  const pc=base>0?Math.min(100,spent/base*100):0;
  return `<div class="tape" style="--p:${pc.toFixed(1)}%">
      <i></i><u>0</u><s>${base>0?Math.round(pc)+'%':'—'}</s>
    </div>
    <div class="tapeleg"><span>Spent <b>${money(spent)}</b></span><span>${esc(capLabel)} <b>${money(base)}</b></span></div>`;
}

function viewProject(){
  const r=rows(), total=sum(r);
  const thisMon=sum(r.filter(e=>(e.date||'').slice(0,7)===today().slice(0,7)));
  const recd=nriTotal();
  const base=recd>0?recd:spentAll();
  const capLabel=recd>0?'Of funds received':'Of both projects';

  const byCat={};
  r.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+(+e.amount||0)});
  const list=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max=list.length?list[0][1]:1;

  let h=`<section class="panel">
    <div class="summary">
      <div class="eyebrow">${tab==='varanasi'?'Varanasi' :'PSR projects'} · total spent${month?' · '+esc(monShow(month)):''}</div>
      <div class="total num">${money(total)}</div>
      ${tape(total,base,capLabel)}
    </div>
    <div class="stats">
      <div><div class="v">${money(thisMon)}</div><div class="l">This month</div></div>
      <div><div class="v">${r.length}</div><div class="l">Entries</div></div>
      <div><div class="v">${list.length}</div><div class="l">Categories</div></div>
    </div>
  </section>

  <div class="filters">
    <input id="q" placeholder="Search payee, note or category" value="${esc(q)}" autocomplete="off">
    <select id="mon" aria-label="Month">
      <option value="">All months</option>
      ${months().map(m=>`<option value="${m}" ${m===month?'selected':''}>${esc(monShow(m))}</option>`).join('')}
    </select>
  </div>`;

  if(!list.length){
    h+=`<section class="panel"><div class="empty"><b>${q||month?'No entries match that':'Nothing recorded yet'}</b>${
      q||month?'Clear the search or pick a different month.':'Record your first payment and it will file itself under a category.'}</div></section>`;
    return h;
  }

  /* group the heads the way the books are kept */
  const grouped={};
  list.forEach(([cid,amt])=>{const g=catGroup(cid);(grouped[g]=grouped[g]||[]).push([cid,amt]);});
  const gOrder=Object.keys(grouped).sort((a,b)=>{
    const d=sum(grouped[b].map(x=>({amount:x[1]})))-sum(grouped[a].map(x=>({amount:x[1]})));
    return d||GROUP_ORDER.indexOf(a)-GROUP_ORDER.indexOf(b);
  });

  h+=`<section class="panel">
    <div class="ledhead"><span class="cols">Category</span><span class="cols">Amount · share</span></div>`;

  gOrder.forEach(g=>{
    const gt=grouped[g].reduce((t,x)=>t+x[1],0);
    h+=`<div class="grp"><span class="g">${esc(g)}</span><span class="gv">${money(gt)}</span></div>`;
    grouped[g].forEach(([cid,amt])=>{
      const ents=r.filter(e=>e.cat===cid);
      const isOpen=open===cid;
      h+=`<button class="crow" data-cat="${cid}" aria-expanded="${isOpen}">
        <span class="chev">▶</span>
        <span class="cmeta">
          <span class="cname">${esc(catName(cid))}</span>
          <span class="csub">${ents.length} entr${ents.length===1?'y':'ies'}</span>
          <span class="track"><i style="width:${Math.max(4,amt/max*100)}%"></i></span>
        </span>
        <span class="cfig"><span class="camt">${money(amt)}</span><span class="cpc">${total?Math.round(amt/total*100):0}%</span></span>
      </button>`;
      if(isOpen){
        ents.forEach(e=>{
          h+=`<div class="entry sub">
            <div class="m">
              <div class="t">${esc(e.desc||catName(e.cat))}</div>
              <div class="s">${dshow(e.date)}${e.payee?' · '+esc(e.payee):''}<span class="tag">${esc(e.mode||'cash')}</span></div>
            </div>
            <div class="a">${money(e.amount)}</div>
            <button class="kebab" data-edit="${e.id}" aria-label="Edit entry">⋯</button>
          </div>`;
        });
      }
    });
  });

  h+=`<div class="tfoot"><span>Total${month?' · '+esc(monShow(month)):''}</span><b>${money(total)}</b></div></section>`;
  return h;
}

function viewNRI(){
  const recd=nriTotal(), spent=spentAll();
  const av=spentOn('varanasi'), ap=spentOn('psr');
  const bal=recd-spent;

  let h=`<section class="panel">
    <div class="summary">
      <div class="eyebrow">NRI funds received · total</div>
      <div class="total num">${money(recd)}</div>
      ${tape(spent,recd,'Received')}
      <div class="sub">Balance in hand <b class="num" style="color:${bal<0?'var(--rust)':'var(--ok)'}">${money(bal)}</b></div>
    </div>
    <div class="stats">
      <div><div class="v">${money(av)}</div><div class="l">Varanasi</div></div>
      <div><div class="v">${money(ap)}</div><div class="l">PSR projects</div></div>
      <div><div class="v">${S.nri.length}</div><div class="l">Receipts</div></div>
    </div>
  </section>`;

  if(!S.nri.length) return h+`<section class="panel"><div class="empty"><b>No receipts yet</b>Record each amount sent from abroad — who sent it, the date, the foreign currency and the rupees credited.</div></section>`;

  h+=`<section class="panel"><div class="ledhead"><span class="cols">Received from</span><span class="cols">Credited ₹</span></div>`;
  S.nri.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(n=>{
    h+=`<div class="entry">
      <div class="m">
        <div class="t">${esc(n.from||'Received')}</div>
        <div class="s">${dshow(n.date)}${n.fx?' · '+esc(n.cur||'USD')+' '+esc(n.fx)+(n.rate?' @ '+esc(n.rate):''):''}${n.to?'<span class="tag">'+esc(n.to)+'</span>':''}</div>
      </div>
      <div class="a">${money(n.inr)}</div>
      <button class="kebab" data-nri="${n.id}" aria-label="Edit receipt">⋯</button>
    </div>`;
  });
  h+=`<div class="tfoot"><span>Total received</span><b>${money(recd)}</b></div></section>`;
  return h;
}

function bind(){
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{open=open===b.dataset.cat?null:b.dataset.cat;render();});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>entryForm(b.dataset.edit));
  document.querySelectorAll('[data-nri]').forEach(b=>b.onclick=()=>nriForm(b.dataset.nri));
  const qi=document.getElementById('q');
  if(qi) qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p);};
  const mo=document.getElementById('mon');
  if(mo) mo.onchange=e=>{month=e.target.value;render();};
}

/* ---------- sheet ----------
   Every sheet gets a title bar with ✕, and a ‹ back arrow when it was
   opened from another sheet — so there is always one tap out of here. */
let sheetBack=null;
function sheet(title,html,back){
  sheetBack=back||null;
  document.getElementById('sheetTitle').textContent=title;
  const bb=document.getElementById('sheetBack');
  bb.hidden=!back;
  document.getElementById('sheetBody').innerHTML=html;
  document.getElementById('sheetBody').scrollTop=0;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  document.body.classList.add('locked');
}
function closeSheet(){
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  document.body.classList.remove('locked');
  sheetBack=null;
}
document.getElementById('scrim').onclick=closeSheet;
document.getElementById('sheetX').onclick=closeSheet;
document.getElementById('sheetBack').onclick=()=>{const f=sheetBack; if(f) f(); else closeSheet();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('sheet').classList.contains('on')) closeSheet();});

      <option value="psr" ${e.project==='psr'?'selected':''}>PSR projects accounts</option>
    </select>
    <label>Category</label>
    <select id="f_cat">
      ${groups.map(g=>`<optgroup label="${esc(g)}">${S.cats.filter(c=>(c.group||'Other')===g).map(c=>`<option value="${c.id}" ${c.id===e.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('')}
    </select>
    <div class="two">
      <div><label>Amount ₹</label><input id="f_amount" type="number" inputmode="decimal" value="${esc(e.amount)}" placeholder="0"></div>
      <div><label>Date</label><input id="f_date" type="date" value="${esc(e.date)}"></div>
    </div>
    <label>What for</label>
    <input id="f_desc" value="${esc(e.desc)}" placeholder="e.g. 40 bags cement">
    <div class="two">
      <div><label>Paid to</label><input id="f_payee" value="${esc(e.payee)}" placeholder="Name / firm"></div>
      <div><label>Mode</label><select id="f_mode">${['Cash','Bank','UPI','Cheque'].map(m=>`<option ${m===e.mode?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>
    <label>Notes</label>
    <textarea id="f_notes" placeholder="Bill number, pending balance, anything to remember">${esc(e.notes)}</textarea>
    <button class="btn" id="f_save">${id?'Save changes':'Add entry'}</button>
    ${id?'<button class="btn danger" id="f_del">Delete entry</button>':''}
    <button class="btn ghost" data-close>Cancel</button>
  `);
  document.getElementById('f_save').onclick=()=>{
    const amt=+document.getElementById('f_amount').value;
    if(!amt){toast('Enter an amount first');return;}
    const o={
      id:e.id||uid(),
      project:document.getElementById('f_project').value,
      cat:document.getElementById('f_cat').value,
      amount:amt,
      date:document.getElementById('f_date').value||today(),
      desc:document.getElementById('f_desc').value.trim(),
      payee:document.getElementById('f_payee').value.trim(),
      mode:document.getElementById('f_mode').value,
      notes:document.getElementById('f_notes').value.trim()
    };
    stamp(o);
    if(e.id) S.entries=S.entries.map(x=>x.id===e.id?o:x); else S.entries.push(o);
    closeSheet(); save(); toast(e.id?'Entry updated':'Entry added');
  };
  if(id) document.getElementById('f_del').onclick=()=>{
    if(!confirm('Delete this entry permanently?'))return;
    S.tomb[id]=Date.now();
    S.entries=S.entries.filter(x=>x.id!==id); closeSheet(); save(); toast('Entry deleted');
  };
}

/* ---------- categories ---------- */
function catsSheet(){
  const used={};S.entries.forEach(e=>used[e.cat]=(used[e.cat]||0)+1);
  const groups=[...new Set(S.cats.map(c=>c.group||'Other'))]
    .sort((a,b)=>GROUP_ORDER.indexOf(a)-GROUP_ORDER.indexOf(b));
  sheet('Categories',`
    <p class="note" style="margin-top:12px">Tap a category to rename it, move its entries somewhere else, or remove it.</p>
    <button class="btn accent" id="c_new">+ Add a category</button>
    ${groups.map(g=>`
      <label>${esc(g)}</label>
      ${S.cats.filter(c=>(c.group||'Other')===g).map(c=>`
        <button class="pick" data-c="${c.id}"><b>${esc(c.name)}</b><em>${used[c.id]||0} entries</em></button>`).join('')}
    `).join('')}
    <button class="btn ghost" data-close>Done</button>
  `);
  document.getElementById('c_new').onclick=()=>catEdit(null);
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>catEdit(b.dataset.c));
}

function catEdit(id){
  const c=S.cats.find(x=>x.id===id)||{id:null,name:'',group:'Materials'};
  const groups=[...new Set(S.cats.map(x=>x.group||'Other').concat(GROUP_ORDER))];
  const n=S.entries.filter(e=>e.cat===id).length;
  sheet(id?'Edit category':'New category',`
    <label>Name</label>
    <input id="c_name" value="${esc(c.name)}" placeholder="e.g. Borewell">
    <label>Group it under</label>
    <select id="c_grp">${groups.map(g=>`<option ${g===c.group?'selected':''}>${esc(g)}</option>`).join('')}</select>
    <button class="btn" id="c_save">${id?'Save changes':'Add category'}</button>
    ${id?`
      <label>Move entries</label>
      <select id="c_move"><option value="">Choose a category…</option>${S.cats.filter(x=>x.id!==id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
      <button class="btn ghost" id="c_movebtn">Move all ${n} entries there</button>
      <button class="btn danger" id="c_del">Delete category</button>`:''}
    <button class="btn ghost" id="c_back">Back to all categories</button>
    <button class="btn ghost" data-close>Close</button>
  `, catsSheet);
  document.getElementById('c_back').onclick=catsSheet;
  document.getElementById('c_save').onclick=()=>{
    const nm=document.getElementById('c_name').value.trim();
    if(!nm){toast('Give the category a name');return;}
    const g=document.getElementById('c_grp').value;
    if(id) S.cats=S.cats.map(x=>x.id===id?stamp({...x,name:nm,group:g}):x);
    else S.cats.push(stamp({id:uid(),name:nm,group:g}));
    save(); catsSheet(); toast(id?'Category updated':'Category added');
  };
  if(id){
    document.getElementById('c_movebtn').onclick=()=>{
      const t=document.getElementById('c_move').value;
      if(!t){toast('Pick where the entries should go');return;}
      S.entries=S.entries.map(e=>e.cat===id?stamp({...e,cat:t}):e);
      save(); catsSheet(); toast(n+' entries moved to '+catName(t));
    };
    document.getElementById('c_del').onclick=()=>{
      if(n){toast('Move its '+n+' entries out first');return;}
      if(!confirm('Delete this category?'))return;
      S.tomb[id]=Date.now();
      S.cats=S.cats.filter(x=>x.id!==id); save(); catsSheet(); toast('Category deleted');
    };
  }
}

/* ══════════════════════════════════════════════════════════════════════
   BACKUP & RESTORE
   The backup is read off Firebase, not off this phone, so it is the shared
   copy both phones see — not whatever one handset happens to be holding.
   ══════════════════════════════════════════════════════════════════════ */
const BK_LAST='pa-last-backup';
const bkStamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};

function bkPacket(st){
  return {app:'psr-project-accounts', version:1, node:NODE,
          takenAt:Date.now(), takenOn:new Date().toISOString(),
          data:{cats:st.cats||[], entries:st.entries||[], nri:st.nri||[], tomb:st.tomb||{}}};
}
function bkCounts(d){
  return '• '+(d.entries||[]).length+' entries\n'+
         '• '+(d.nri||[]).length+' NRI receipts\n'+
         '• '+(d.cats||[]).length+' categories';
}
async function bkState(){
  try{
    const r=await fetchT(dbPath(),{cache:'no-store'},15000);
    if(r.ok){ const d=await r.json(); if(d) return d; }
  }catch(e){}
  return payload();                       /* offline — fall back to this phone */
}
async function bkDownload(name,mark){
  const p=bkPacket(await bkState());
  dl(name||('project-accounts-backup-'+bkStamp()+'.json'),JSON.stringify(p,null,1),'application/json');
  if(mark) LS.set(BK_LAST,String(Date.now()));
  return p;
}
function bkWhen(){
  const ts=+LS.get(BK_LAST)||0;
  if(!ts) return 'No backup taken yet. Take one now, then once a month is plenty.';
  const days=Math.floor((Date.now()-ts)/86400000);
  const d=new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  return 'Last backup '+(days===0?'today':days===1?'yesterday':days+' days ago')+' — '+d+
         (days>=30?'. Worth taking a fresh one.':'');
}

async function bkRestore(file){
  let p;
  try{
    p=JSON.parse(await file.text());
    if(p.app!=='psr-project-accounts'||!p.data) throw 0;
  }catch(e){
    alert('That is not a Project Accounts backup file.\n\nPick a file named project-accounts-backup-….json');
    return;
  }
  const d=p.data;
  const when=p.takenAt?new Date(p.takenAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'unknown date';
  if(!confirm('Restore this backup?\n\nTaken '+when+'\n\n'+bkCounts(d)+
    '\n\nEverything is REPLACED with what is in the file. Anything entered since that date is lost.'+
    '\n\nA copy of today\u2019s data downloads first, so you can go back.')) return;

  try{ await bkDownload('project-accounts-before-restore-'+bkStamp()+'.json',false); }
  catch(e){ alert('Could not save today\u2019s copy first, so nothing was changed.\n\nCheck the connection and try again.'); return; }

  if(prompt('Last check.\n\nType the word RESTORE to go ahead.')!=='RESTORE'){ toast('Nothing was changed'); return; }

  const t=Date.now();
  const next=Object.assign(fresh(),{fb:S.fb,updated:t,tomb:d.tomb||{}});
  next.cats   =(d.cats   ||[]).map(x=>Object.assign({},x,{m:t}));
  next.entries=(d.entries||[]).map(x=>Object.assign({},x,{m:t}));
  next.nri    =(d.nri    ||[]).map(x=>Object.assign({},x,{m:t}));

  /* Write straight to Firebase, stepping around the merge. A normal save would
     merge, and anything still sitting up there would flow back in and quietly
     undo the restore. Live sync is paused until the write lands. */
  liveOff(); pollOff();
  try{
    const {fb,...rest}=next;
    const w=await fetchT(dbPath(),{method:'PUT',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(rest)},20000);
    if(!w.ok) throw new Error('write blocked ('+w.status+')');
  }catch(e){
    pollOn(); liveOn();
    alert('The restore could not be written to Firebase, so nothing was changed.\n\n'+(e.message||'Check the connection.'));
    return;
  }
  S=next;
  LS.set(K,JSON.stringify(S));
  closeSheet(); render();
  line('Firebase · <b>restored '+clock()+'</b>','live');
  toast('Backup restored');
  pollOn(); liveOn();
}

/* ---------- settings ---------- */
function setSheet(){
  sheet('Settings',`
    <label>Firebase database URL</label>
    <input id="s_fb" value="${esc(S.fb)}" placeholder="https://yourdb.firebasedatabase.app">
    <p class="note">Every phone that opens this app with the same URL above shares one set of books. Entries merge together, so two people can add at the same time without wiping each other.</p>
    <button class="btn" id="s_save">Save and sync now</button>
    <button class="btn ghost" id="s_now">Force a sync right now</button>
    <label>Backup</label>
    <p class="note" id="s_lastbk">${esc(bkWhen())}</p>
    <button class="btn ghost" id="s_json">Download a backup (JSON)</button>
    <button class="btn ghost" id="s_csv">Download CSV of all entries</button>
    <label>Restore</label>
    <p class="note">Puts a backup file back. Everything is replaced with what is in the file, and today's data downloads first so you can undo it.</p>
    <button class="btn ghost" id="s_pick">Choose a backup file…</button>
    <input id="s_file" type="file" accept=".json,application/json" style="display:none">
    <label>Security</label>
    <button class="btn ghost" id="s_lock">Lock this app now</button>
    <button class="btn ghost" data-close>Close</button>
  `);
  document.getElementById('s_lock').onclick=()=>{
    if(window.PAAuth){ PAAuth.signOut(); location.reload(); }
  };
  document.getElementById('s_save').onclick=()=>{
    S.fb=document.getElementById('s_fb').value.trim()||DEFAULT_FB;
    save(false); syncNow(); closeSheet(); toast('Sync settings saved');
  };
  document.getElementById('s_now').onclick=()=>{ syncNow(); toast('Syncing…'); };
  document.getElementById('s_csv').onclick=()=>{
    const head='Project,Date,Category,Description,Paid to,Mode,Amount,Notes\n';
    const body=S.entries.map(e=>[e.project,e.date,catName(e.cat),e.desc,e.payee,e.mode,e.amount,e.notes]
      .map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const nri='\n\nNRI RECEIPTS\nDate,From,Currency,Foreign amount,Rate,INR,Meant for,Notes\n'+
      S.nri.map(n=>[n.date,n.from,n.cur,n.fx,n.rate,n.inr,n.to,n.notes].map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
    dl('project-accounts.csv',head+body+nri,'text/csv');
  };
  const bj=document.getElementById('s_json');
  bj.onclick=async()=>{
    if(bj.disabled) return;
    bj.disabled=true; bj.textContent='Reading the books…';
    try{
      const p=await bkDownload(null,true);
      const el=document.getElementById('s_lastbk'); if(el) el.textContent=bkWhen();
      toast((p.data.entries.length+p.data.nri.length)+' records saved to one file');
    }catch(e){ toast('Backup stopped — check the connection'); }
    finally{ bj.disabled=false; bj.textContent='Download a backup (JSON)'; }
  };
  document.getElementById('s_pick').onclick=()=>document.getElementById('s_file').click();
  document.getElementById('s_file').onchange=ev=>{
    const f=ev.target.files[0]; ev.target.value='';
    if(f) bkRestore(f);
  };
}
function dl(name,txt,type){
  const b=new Blob([txt],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),3000);
}

/* ---------- wiring ---------- */
document.getElementById('sheetBody').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')) closeSheet();
});
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;open=null;q='';month='';render();});
document.getElementById('fab').onclick=()=>tab==='nri'?nriForm(null):entryForm(null);
document.getElementById('btnCats').onclick=catsSheet;
document.getElementById('btnSet').onclick=setSheet;

render(); syncNow(); liveOn();

/* poll every 6s while the app is on screen, stop while it is in the background */
let poll=null;
function pollOn(){ if(!poll) poll=setInterval(()=>syncNow(true),6000); }
function pollOff(){ if(poll){ clearInterval(poll); poll=null; } }
pollOn();

function wake(){ pollOn(); liveOn(); syncNow(true); }
document.addEventListener('visibilitychange',()=>{ document.hidden?(pollOff(),liveOff()):wake(); });
window.addEventListener('pageshow',wake);   /* iOS restores from frozen state */
window.addEventListener('focus',wake);
window.addEventListener('online',wake);
</script>
